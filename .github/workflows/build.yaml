name: build

on:
  pull_request: {}
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  yoga-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: libyoga.so
          - os: macos-latest
            binary_name: libyoga.dylib
          #- os: windows-latest
          #  binary_name: yoga.dll
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v2
      # Validate without checking out submodules which have their own wrappers (which we don't use).
      - uses: gradle/wrapper-validation-action@v1
      - run: git submodule update --init --depth 1
      - uses: actions/setup-java@v1
        with:
          java-version: 11
      - run: ./gradlew -p mosaic :yoga:jni:build
      - uses: actions/upload-artifact@v2
        with:
          name: resources
          path: mosaic/yoga/jni/build/lib/main/debug/${{matrix.binary_name}}
          if-no-files-found: error

  mosaic-build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          #- windows-latest
    runs-on: ${{matrix.os}}
    needs: yoga-build
    steps:
      - uses: actions/checkout@v2
      - run: git submodule update --init --depth 1
      - uses: actions/setup-java@v1
        with:
          java-version: 11
      - uses: actions/download-artifact@v2
        with:
          path: mosaic/yoga/src/main

      - run: ./gradlew -p mosaic build -PmosaicMultiplatformBuild=true
      - run: ./gradlew build -PmosaicMultiplatformBuild=true

  publish:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/trunk' && github.repository == 'JakeWharton/mosaic' }}
    needs: mosaic-build
    steps:
      - uses: actions/checkout@v2
      - run: git submodule update --init --depth 1
      - uses: actions/setup-java@v1
        with:
          java-version: 11
      - uses: actions/download-artifact@v2
        with:
          path: mosaic/yoga/src/main

      - run: ./gradlew -p mosaic publish dokkaHtmlMultiModule -PmosaicMultiplatformBuild=true
        env:
          ORG_GRADLE_PROJECT_SONATYPE_NEXUS_USERNAME: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_SONATYPE_NEXUS_PASSWORD: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}

      - name: Deploy docs to website
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: site
          FOLDER: mosaic/build/dokka/htmlMultiModule
          TARGET_FOLDER: docs/latest/
          CLEAN: true
